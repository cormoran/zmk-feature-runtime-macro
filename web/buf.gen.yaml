version: v2
inputs:
  - directory: ../proto
  # Vendored copy of zmk-feature-custom-settings' proto, for the generic
  # CreateSetting/DeleteSetting RPC client - see vendor-proto/README note in
  # the .proto file itself. Kept out of ../proto so the firmware build
  # (which globs proto/*.proto) never sees it.
  - directory: vendor-proto
plugins:
  - local: protoc-gen-ts_proto
    opt:
      - outputServices=false
      - outputJsonMethods=false
      - outputClientImpl=false
      - useExactTypes=false
      - esModuleInterop=true
      # Plain TS `enum` (ts-proto's default) emits runtime code, which this
      # project's tsconfig `erasableSyntaxOnly` forbids - an `as const`
      # object literal is erasable. Only the vendored custom_settings proto
      # declares any enums; runtime_macro.proto has none.
      - enumsAsLiterals=true
    out: src/proto
